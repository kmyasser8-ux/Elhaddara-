<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>منصة الحضارة</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="nav">
  <div class="logo">الحضارة</div>
  <div class="actions">
    <button onclick="toggleTheme()" aria-label="تغيير المظهر">🌓</button>
    <a href="dashboard.html" class="btn-dashboard">لوحة التحكم</a>
  </div>
</nav>

<main>

  <section id="homeView" class="view active">
    <h1>الأقسام الفكرية</h1>
    <div id="categories" class="grid"></div>
  </section>

  <section id="categoryView" class="view">
    <button onclick="goHome()" class="btn-back">← رجوع</button>
    <h2 id="categoryTitle"></h2>
    <div id="articles"></div>
  </section>

  <section id="articleView" class="view">
    <button onclick="goCategory()" class="btn-back">← رجوع</button>
    <h2 id="articleTitle"></h2>
    <div id="articleContent"></div>
  </section>

</main>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>

</body>
</html>
