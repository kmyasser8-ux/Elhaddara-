<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منصة الحضارة الفكرية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="nav">
    <div class="logo">مَنَصَّةُ الحَضَارَة</div>
    <div class="actions">
      <button onclick="toggleTheme()" title="تبديل المظهر">🌓</button>
      <a href="dashboard.html"><i class="fa-solid fa-sliders"></i> لوحة التحكم</a>
    </div>
  </div>

  <div id="homeView" class="view active">
    <h2 style="color: #c7a86b; margin-bottom: 25px; border-bottom: 1px solid #2a3558; pb-2">الأقسام والعلوم الفكرية</h2>
    <div id="categories" class="grid"></div>
  </div>

  <div id="categoryView" class="view">
    <button onclick="goHome()">← العودة للرئيسية</button>
    <h2 id="categoryTitle" style="color: #c7a86b; margin-bottom: 20px;"></h2>
    <div id="articles" class="articles-list">
      </div>
  </div>

  <div id="articleView" class="view">
    <button onclick="goCategory()">← العودة للقسم</button>
    <h2 id="articleTitle" style="color: #c7a86b; margin-bottom: 20px;"></h2>
    <div id="articleContent"></div>
  </div>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>

</body>
</html>
