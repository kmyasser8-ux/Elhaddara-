<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحضارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .font-amiri { font-family: 'Amiri', serif; }
        .font-kufi { font-family: 'Reem Kufi', sans-serif; }
        .font-tajawal { font-family: 'Tajawal', sans-serif; }
        .font-cairo { font-family: 'Cairo', sans-serif; }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
    </style>
</head>
<body id="bodyPage" class="bg-[#fcfbf7] text-gray-900 min-h-screen relative pb-24 transition-colors duration-300">

    <header class="w-full bg-[#111111] text-white py-12 px-6 md:px-12 border-b-4 border-[#b89452] relative z-10">
        <div class="max-w-6xl mx-auto w-full flex justify-between items-center relative z-10">
            
            <div>
                <h1 class="text-4xl md:text-6xl font-bold font-kufi tracking-widest text-white border-b-2 border-transparent pb-2">
                    الحضارة
                </h1>
                <p class="text-xs md:text-sm text-gray-400 mt-2 pr-4 font-light">
                    العلوم الإنسانية والإسلامية
                </p>
            </div>

            <div class="relative flex items-center gap-4">
                
                <button id="darkModeToggle" class="text-xl p-2 rounded-full hover:bg-gray-800 transition-colors" title="تغيير المظهر">
                    🌙
                </button>

                <button id="menuToggle" class="text-xl p-2 rounded-full hover:bg-gray-800 transition-colors" title="القائمة">
                    ☰
                </button>

                <button onclick="toggleSettingsMenu()" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-ellipsis-v text-xl"></i>
                </button>

                <div id="settingsMenu" class="hidden absolute left-0 mt-3 top-full w-72 bg-white text-gray-800 rounded-lg shadow-2xl p-5 border border-gray-100 z-50">
                    <h4 class="font-bold border-b pb-2 mb-3 flex items-center gap-2 text-gray-900">
                        <i class="fas fa-sliders-h text-[#b89452]"></i> لوحة التحكم والإدارة
                    </h4>
                    
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">1. خط اللغة المتبع</label>
                        <select onchange="changeFont(this.value)" class="w-full bg-gray-50 border rounded p-1.5 text-sm">
                            <option value="font-cairo">خط قاهرة (عصري ومبسط)</option>
                            <option value="font-amiri">خط أميري (نسخ أكاديمي أصيل)</option>
                            <option value="font-kufi">خط ريم كوفي (كوفي جمالي)</option>
                            <option value="font-tajawal">خط تجول (رسمي وأنيق)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">2. إضافة وهيكلة العناصر</label>
                        <button onclick="alert('لوحة الإدارة مهيأة!')" class="w-full bg-gray-900 text-white text-sm rounded py-1.5 hover:bg-gray-800 transition flex items-center justify-center gap-2">
                            <i class="fas fa-plus-circle"></i> إضافة عنصر أو مقال الآن
                        </button>
                    </div>

                    <div class="mb-2">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">3. قوالب الألوان والمظهر</label>
                        <div class="grid grid-cols-2 gap-2 text-[11px]">
                            <button onclick="changeGlobalTheme('dark')" class="bg-gray-950 text-white p-1.5 rounded hover:bg-gray-900">الداكن المطلق</button>
                            <button onclick="changeGlobalTheme('classic')" class="bg-amber-50 text-amber-900 p-1.5 rounded hover:bg-amber-100 border border-amber-200">البيج الكلاسيكي</button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </header>
    <div id="sidebar" class="fixed top-0 -right-64 w-64 h-full bg-[#111111] text-white transition-all duration-300 z-50 p-5 shadow-2xl border-l border-gray-800">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h3 class="text-lg font-bold font-tajawal text-[#b89452]">أقسام المنصة</h3>
            <button id="closeSidebar" class="text-gray-400 hover:text-white transition-colors text-xl">✕</button>
        </div>
        <nav class="flex flex-col gap-4 font-cairo">
            <a href="#" class="p-2 rounded hover:bg-gray-900 hover:text-[#b89452] transition-all">المحاضرات</a>
            <a href="#" class="p-2 rounded hover:bg-gray-900 hover:text-[#b89452] transition-all">التمارين والحلول</a>
            <a href="#" class="p-2 rounded hover:bg-gray-900 hover:text-[#b89452] transition-all">المراجع العلمية</a>
        </nav>
    </div>
    <main class="max-w-6xl mx-auto px-4 py-12">
        <nav class="max-w-6xl mx-auto px-4 py-12">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                
                <div onclick="spreadTheme('islamic', '#1b4332', '#eaf2ec')" class="cursor-pointer bg-white rounded-xl p-6 shadow-sm border border-gray-100 hover:shadow-md transition">
                    <div class="w-20 h-20 mx-auto bg-emerald-50 text-emerald-700 rounded-full flex items-center justify-center text-3xl mb-4">
                        <i class="fas fa-mosque"></i>
                    </div>
                    <h3 class="font-bold text-lg text-emerald-900 mb-1 text-center font-tajawal">العلوم الإسلامية</h3>
                    <p class="text-xs text-emerald-600 text-center font-cairo">الفقه، الفكر والرموز التاريخية</p>
                </div>

                </div>
        </nav>
    </main>

    <script>
        function toggleSettingsMenu() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('hidden');
        }
        function changeFont(fontClass) {
            document.body.className = document.body.className.replace(/font-\w+/g, '');
            document.body.classList.add(fontClass);
        }
        function changeGlobalTheme(theme) {
            if(theme === 'dark') {
                document.body.style.backgroundColor = '#111111';
                document.body.style.color = '#ffffff';
            } else {
                document.body.style.backgroundColor = '#fcfbf7';
                document.body.style.color = '#1a202c';
            }
        }
        function spreadTheme(type, color1, color2) {
            console.log("تم اختيار القسم:", type);
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
