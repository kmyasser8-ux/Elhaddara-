<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الحضارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #0a0c15; color: white; font-family: 'Cairo', sans-serif; }
        .btn-gold { background: #c7a86b; color: #0a0c15; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-gold:hover { background: #d4b87a; transform: scale(1.02); }
        .btn-red { background: #dc2626; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; border: none; }
        .btn-outline { background: transparent; border: 1px solid #c7a86b; color: #c7a86b; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .card { background: #1e1f2e; border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem; border-right: 4px solid #c7a86b; }
        input, textarea { background: #2d2f42; border: none; padding: 12px; border-radius: 12px; color: white; width: 100%; margin-top: 5px; outline: none; }
        input:focus, textarea:focus { border: 1px solid #c7a86b; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content { background: #1a1c2c; padding: 2rem; border-radius: 28px; width: 90%; max-width: 500px; }
        .tab-btn { padding: 10px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #c7a86b; color: #0a0c15; }
        .tab-btn:not(.active) { background: #2d2f42; }
    </style>
</head>
<body class="p-6">

<div class="max-w-6xl mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-[#c7a86b]">🎛️ لوحة تحكم الحضارة</h1>
        <p class="text-gray-400 mt-2">إدارة جميع مقالات المنصة (العلوم الإسلامية، السياسة، علم النفس، الفلسفة)</p>
        <div class="w-24 h-0.5 bg-[#c7a86b] mx-auto mt-3"></div>
    </div>

    <!-- أزرار التبويب -->
    <div class="flex flex-wrap gap-3 justify-center mb-8">
        <button onclick="showSection('islamic')" id="tabIslamic" class="tab-btn active">🕌 العلوم الإسلامية</button>
        <button onclick="showSection('politics')" id="tabPolitics" class="tab-btn">🌍 السياسة</button>
        <button onclick="showSection('psychology')" id="tabPsychology" class="tab-btn">🧠 علم النفس</button>
        <button onclick="showSection('philosophy')" id="tabPhilosophy" class="tab-btn">📜 الفلسفة</button>
    </div>

    <!-- قسم العلوم الإسلامية -->
    <div id="islamicSection" class="section-content">
        <div class="flex justify-between items-center flex-wrap mb-5">
            <h2 class="text-2xl font-bold"><i class="fas fa-mosque text-[#c7a86b]"></i> مقالات العلوم الإسلامية</h2>
            <button onclick="openAddModal('islamic')" class="btn-gold text-sm"><i class="fas fa-plus"></i> مقال جديد</button>
        </div>
        <div id="islamicArticlesList" class="space-y-3"></div>
    </div>

    <!-- قسم السياسة -->
    <div id="politicsSection" class="section-content" style="display:none">
        <div class="flex justify-between items-center flex-wrap mb-5">
            <h2 class="text-2xl font-bold"><i class="fas fa-globe text-blue-400"></i> مقالات السياسة</h2>
            <button onclick="openAddModal('politics')" class="btn-gold text-sm"><i class="fas fa-plus"></i> مقال جديد</button>
        </div>
        <div id="politicsArticlesList" class="space-y-3"></div>
    </div>

    <!-- قسم علم النفس -->
    <div id="psychologySection" class="section-content" style="display:none">
        <div class="flex justify-between items-center flex-wrap mb-5">
            <h2 class="text-2xl font-bold"><i class="fas fa-brain text-purple-400"></i> مقالات علم النفس</h2>
            <button onclick="openAddModal('psychology')" class="btn-gold text-sm"><i class="fas fa-plus"></i> مقال جديد</button>
        </div>
        <div id="psychologyArticlesList" class="space-y-3"></div>
    </div>

    <!-- قسم الفلسفة -->
    <div id="philosophySection" class="section-content" style="display:none">
        <div class="flex justify-between items-center flex-wrap mb-5">
            <h2 class="text-2xl font-bold"><i class="fas fa-scroll text-amber-400"></i> مقالات الفلسفة</h2>
            <button onclick="openAddModal('philosophy')" class="btn-gold text-sm"><i class="fas fa-plus"></i> مقال جديد</button>
        </div>
        <div id="philosophyArticlesList" class="space-y-3"></div>
    </div>

    <div class="mt-8 text-center text-gray-500 text-sm border-t border-gray-700 pt-6">
        ✅ جميع التغييرات تحفظ تلقائياً. <a href="index.html" target="_blank" class="text-[#c7a86b] hover:underline">← افتح المنصة الرئيسية</a>
    </div>
</div>

<!-- نافذة إضافة/تعديل -->
<div id="articleModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" class="text-xl font-bold mb-4">إضافة مقال جديد</h3>
        <input type="hidden" id="currentSection">
        <input type="hidden" id="editIndex">
        <input type="text" id="articleTitle" placeholder="عنوان المقال" class="mb-3">
        <textarea id="articleText" placeholder="نص المقال..." rows="4" class="mb-4"></textarea>
        <div class="flex gap-3">
            <button onclick="saveArticle()" class="btn-gold">💾 حفظ</button>
            <button onclick="closeModal()" class="btn-outline">إلغاء</button>
        </div>
    </div>
</div>

<script>
    let currentView = 'islamic';
    let articlesData = {
        islamic: [],
        politics: [],
        psychology: [],
        philosophy: []
    };

    function loadData() {
        const sections = ['islamic', 'politics', 'psychology', 'philosophy'];
        sections.forEach(section => {
            const saved = localStorage.getItem(`${section}Articles`);
            if(saved) {
                articlesData[section] = JSON.parse(saved);
            } else {
                // بيانات افتراضية
                if(section === 'islamic') articlesData[section] = [
                    { title: "الصراع الطائفي بين السلفية والإثني عشرية", text: "تحليل تاريخي وسياسي وفكري لأبرز التحولات العقائدية." },
                    { title: "الدعاء وتأثيره على البناء النفسي", text: "كيف يغير الإيمان والدعاء سلوك الإنسان." },
                    { title: "الفقه الإسلامي بين الأصالة والتجديد", text: "قراءة في تطور المدارس الفقهية." }
                ];
                else if(section === 'politics') articlesData[section] = [
                    { title: "كيف تبني الدول العظمى نفوذها؟", text: "تحليل آليات الاقتصاد والعسكر والتكنولوجيا." },
                    { title: "قصص صعود الدول", text: "تجارب اليابان والصين وألمانيا." }
                ];
                else if(section === 'psychology') articlesData[section] = [
                    { title: "قوة العقل الباطن", text: "تأثير الأفكار على السلوك." },
                    { title: "الوعي الجمعي", text: "كيف يتحكم بالمجتمعات." }
                ];
                else if(section === 'philosophy') articlesData[section] = [
                    { title: "المذاهب الفكرية", text: "الوجودية والماركسية." },
                    { title: "تطور الفلسفة", text: "من اليونان إلى الحداثة." }
                ];
                localStorage.setItem(`${section}Articles`, JSON.stringify(articlesData[section]));
            }
        });
        renderCurrentView();
    }

    function renderCurrentView() {
        const articles = articlesData[currentView];
        const containerId = `${currentView}ArticlesList`;
        const container = document.getElementById(containerId);
        
        if(articles.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-400 py-6">📭 لا توجد مقالات. اضغط "مقال جديد" للإضافة.</div>';
            return;
        }
        
        container.innerHTML = articles.map((art, idx) => `
            <div class="card">
                <div class="flex justify-between items-start flex-wrap gap-2">
                    <div class="flex-1">
                        <h3 class="text-lg font-bold text-[#c7a86b]">${escapeHtml(art.title)}</h3>
                        <p class="text-gray-300 text-sm mt-1">${escapeHtml(art.text.substring(0, 100))}${art.text.length > 100 ? '...' : ''}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editArticle('${currentView}', ${idx})" class="bg-[#c7a86b] text-black px-3 py-1 rounded-full text-sm"><i class="fas fa-edit"></i> تعديل</button>
                        <button onclick="deleteArticle('${currentView}', ${idx})" class="bg-red-600/80 hover:bg-red-600 px-3 py-1 rounded-full text-sm"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function showSection(section) {
        currentView = section;
        document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
        document.getElementById(`${section}Section`).style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${section.charAt(0).toUpperCase() + section.slice(1)}`).classList.add('active');
        renderCurrentView();
    }

    let currentEditSection = null;
    let currentEditIndex = null;

    function openAddModal(section) {
        currentEditSection = section;
        currentEditIndex = null;
        document.getElementById('modalTitle').innerText = '➕ إضافة مقال جديد';
        document.getElementById('currentSection').value = section;
        document.getElementById('articleTitle').value = '';
        document.getElementById('articleText').value = '';
        document.getElementById('editIndex').value = '';
        document.getElementById('articleModal').classList.add('active');
    }

    function editArticle(section, idx) {
        currentEditSection = section;
        currentEditIndex = idx;
        const art = articlesData[section][idx];
        document.getElementById('modalTitle').innerText = '✏️ تعديل المقال';
        document.getElementById('currentSection').value = section;
        document.getElementById('articleTitle').value = art.title;
        document.getElementById('articleText').value = art.text;
        document.getElementById('editIndex').value = idx;
        document.getElementById('articleModal').classList.add('active');
    }

    function saveArticle() {
        const section = document.getElementById('currentSection').value;
        const title = document.getElementById('articleTitle').value.trim();
        const text = document.getElementById('articleText').value.trim();
        const editIdx = document.getElementById('editIndex').value;
        
        if(!title || !text) { alert('الرجاء ملء جميع الحقول'); return; }
        
        if(editIdx !== '') {
            articlesData[section][parseInt(editIdx)] = { title, text };
        } else {
            articlesData[section].push({ title, text });
        }
        
        localStorage.setItem(`${section}Articles`, JSON.stringify(articlesData[section]));
        renderCurrentView();
        closeModal();
        alert('✅ تم حفظ المقال بنجاح');
    }

    function deleteArticle(section, idx) {
        if(confirm('هل تريد حذف هذا المقال نهائياً؟')) {
            articlesData[section].splice(idx, 1);
            localStorage.setItem(`${section}Articles`, JSON.stringify(articlesData[section]));
            renderCurrentView();
            alert('✅ تم حذف المقال');
        }
    }

    function closeModal() { document.getElementById('articleModal').classList.remove('active'); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    window.onclick = e => { if(e.target === document.getElementById('articleModal')) closeModal(); };
    
    loadData();
</script>
</body>
</html>
