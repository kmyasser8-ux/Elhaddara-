<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - منصة الحضارة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #020617;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #c7a86b;
    }
    button {
      background: #c7a86b;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      color: #020617;
    }
    button:hover { opacity: 0.9; }
    .btn-delete { background: #ef4444; color: white; padding: 6px 12px; }
  </style>
</head>

<body class="p-6 max-w-4xl mx-auto">

  <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
    <h1 class="text-2xl font-bold text-[#c7a86b]">
      <i class="fa-solid fa-sliders ml-2"></i> لوحة التحكم - منصة الحضارة
    </h1>
    <a href="index.html" class="text-sm bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition">
      <i class="fa-solid fa-house ml-1"></i> عرض المنصة
    </a>
  </div>

  <div class="card">
    <h2 class="font-bold mb-4 text-lg flex items-center gap-2">
      <i class="fa-solid fa-folder-plus text-[#c7a86b]"></i> إضافة علم فكري جديد
    </h2>
    <input id="catTitle" placeholder="مثال: العلوم الإسلامية، الفلسفة، العلم السياسي...">
    <button onclick="handleAddCategory()">إضافة العلم</button>
  </div>

  <div class="card">
    <h2 class="font-bold mb-4 text-lg flex items-center gap-2">
      <i class="fa-solid fa-list text-[#c7a86b]"></i> العلوم الحالية في المنصة
    </h2>
    <div id="categoriesList" class="space-y-2"></div>
  </div>

  <div class="card">
    <h2 class="font-bold mb-4 text-lg flex items-center gap-2">
      <i class="fa-solid fa-pen-nib text-[#c7a86b]"></i> نشر مقال جديد
    </h2>

    <label class="text-sm text-gray-400">اختر القسم الفكري المستهدف:</label>
    <select id="selectedCategory"></select>

    <input id="articleTitle" placeholder="عنوان المقال الجديد">
    <textarea id="articleText" placeholder="اكتب نص المقال بالتفصيل هنا..." rows="6"></textarea>

    <button onclick="handleAddArticle()">نشر المقال الآن 🚀</button>
  </div>

<script src="data.js"></script>
<script src="storage.js"></script>

<script>
  // تهيئة مخزن البيانات الموحد فور تحميل الصفحة
  Storage.init();

  // توليد معرفات برمجية (IDs) سليمة ومطابقة لما يتوقعه نظام المنصة
  function generateId(text) {
    return text.toLowerCase()
               .replace(/\s+/g, '-')
               .replace(/[^\w-]/g, '') || 'cat-' + Date.now();
  }

  // رندرة وتحديث الواجهة بالاعتماد الكلي على كائن Storage الموحد
  function renderDashboard() {
    const list = document.getElementById('categoriesList');
    const select = document.getElementById('selectedCategory');

    list.innerHTML = '';
    select.innerHTML = '';

    const categories = Storage.getCategories();

    if (categories.length === 0) {
      list.innerHTML = `<div class="text-gray-500 text-sm py-2">لا توجد أقسام مضافة حالياً.</div>`;
      select.innerHTML = `<option value="">-- يجب إضافة علم أولاً --</option>`;
      return;
    }

    categories.forEach((c) => {
      // حساب عدد المقالات الفعلي لكل قسم فكري باستخدام المحرك الموحد
      const count = Storage.getArticles(c.id).length;
      
      list.innerHTML += `
        <div class="flex justify-between items-center border-b border-white/5 py-3 px-2 rounded-lg hover:bg-white/[0.01]">
          <div>
            <div class="font-bold text-[#c7a86b] text-base">${c.title}</div>
            <div class="text-xs text-gray-400 mt-1">يحتوي على (${count}) مقالات</div>
          </div>
          <button class="btn-delete rounded-lg" onclick="handleDeleteCategory('${c.id}')">حذف العلم</button>
        </div>
      `;
      select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
    });
  }

  // إضافة قسم علمي جديد بالتوافق مع بنية الـ Storage الكلية
  function handleAddCategory() {
    const titleInput = document.getElementById('catTitle');
    const title = titleInput.value.trim();
    if (!title) return alert('الرجاء كتابة اسم العلم الفكري!');

    const id = generateId(title);
    const data = Storage.get(); // جلب كائن البيانات الكامل

    if (data.categories.some(c => c.id === id)) {
      return alert('هذا القسم موجود بالفعل!');
    }

    // تعديل البيانات بداخل الكائن الموحد وحفظها
    data.categories.push({ id, title });
    if (!data.articles[id]) data.articles[id] = [];

    Storage.save(data); // الحفظ الآمن عبر دالة الحفظ الرسمية للـ Storage
    
    alert('تم إضافة العلم الفكري الجديد بنجاح! 🎉');
    titleInput.value = '';
    renderDashboard();
  }

  // نشر مقال جديد بالاعتماد على دالة الاستدعاء الذكية addArticle
  function handleAddArticle() {
    const catId = document.getElementById('selectedCategory').value;
    const titleInput = document.getElementById('articleTitle');
    const textInput = document.getElementById('articleText');

    const title = titleInput.value.trim();
    const text = textInput.value.trim();

    if (!catId || !title || !text) return alert('الرجاء إكمال جميع الحقول المستهدفة لنشر المقال.');

    // استخدام دالة إضافة المقال المباشرة من ملف storage.js الفعلي الخاص بك
    Storage.addArticle(catId, { title, text });

    alert('تم نشر المقال بنجاح ومزامنته فوراً مع الواجهة الرئيسية! 🚀');
    titleInput.value = '';
    textInput.value = '';
    renderDashboard();
  }

  // حذف قسم فكري وحذف الكائن المرتبط به عبر الـ Storage
  function handleDeleteCategory(id) {
    if (!confirm('هل تريد حذف القسم وكل مقالاته نهائياً؟ سيتم تطبيق هذا في كامل المنصة.')) return;

    const data = Storage.get();
    data.categories = data.categories.filter(c => c.id !== id);
    delete data.articles[id];

    Storage.save(data);
    renderDashboard();
  }

  // التشغيل الأولي المباشر
  renderDashboard();
</script>
</body>
</html>
