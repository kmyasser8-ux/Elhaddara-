<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>محراب التحكم - منصة الحضارة</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{font-family:'Cairo',sans-serif;background:#020617;color:#f8fafc}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.preview{transition:.3s ease}
.device-mobile{max-width:380px;margin:auto;border:10px solid #1e293b;border-radius:30px}
</style>
</head>

<body class="p-6">

<header class="mb-6 flex justify-between items-center">
<h1 class="text-[#c7a86b] text-xl font-bold">لوحة التحكم الفكرية</h1>
<button onclick="location.href='index.html'" class="text-xs text-gray-300">رجوع</button>
</header>

<!-- Tabs -->
<div class="glass p-2 rounded-xl flex gap-2 text-xs mb-6">
<button onclick="switchTab('science')" id="tab-science" class="flex-1 py-2 bg-[#c7a86b] text-black rounded">العلوم</button>
<button onclick="switchTab('article')" id="tab-article" class="flex-1 py-2">المقالات</button>
<button onclick="switchTab('archive')" id="tab-archive" class="flex-1 py-2">الأرشيف</button>
</div>

<!-- SCIENCE -->
<div id="science" class="glass p-4 rounded-xl space-y-3">
<input id="sci-title" placeholder="اسم العلم" class="w-full p-2 bg-black/20 rounded">
<textarea id="sci-desc" placeholder="وصف" class="w-full p-2 bg-black/20 rounded"></textarea>
<input id="sci-bg" placeholder="رابط صورة" class="w-full p-2 bg-black/20 rounded">

<button onclick="saveScience()" class="w-full bg-[#c7a86b] text-black py-2 rounded font-bold">
حفظ العلم
</button>

<div id="science-preview" class="mt-4 p-4 glass rounded"></div>
</div>

<!-- ARTICLE -->
<div id="article" class="hidden glass p-4 rounded-xl space-y-3">

<select id="art-category" class="w-full p-2 bg-black/20 rounded"></select>
<input id="art-title" placeholder="عنوان المقال" class="w-full p-2 bg-black/20 rounded">
<textarea id="art-text" placeholder="المقال..." class="w-full p-2 bg-black/20 rounded h-32"></textarea>

<button onclick="saveArticle()" class="w-full bg-[#c7a86b] text-black py-2 rounded font-bold">
نشر المقال
</button>

<div id="article-preview" class="mt-4 glass p-4"></div>
</div>

<!-- ARCHIVE -->
<div id="archive" class="hidden glass p-4 rounded-xl">
<div id="archive-list"></div>
</div>

<script>
const LS_KEY="hcategories";

const defaultData=[
{id:"philo",title:"الفلسفة",desc:"فكر عميق",bg:""},
{id:"psych",title:"علم النفس",desc:"العقل البشري",bg:""}
];

function getData(){
return JSON.parse(localStorage.getItem(LS_KEY))||defaultData;
}

function saveData(d){
localStorage.setItem(LS_KEY,JSON.stringify(d));
}

function switchTab(t){
["science","article","archive"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});
document.getElementById(t).classList.remove("hidden");
}

function saveScience(){
let data=getData();
data.push({
id:Date.now(),
title:document.getElementById("sci-title").value,
desc:document.getElementById("sci-desc").value,
bg:document.getElementById("sci-bg").value
});
saveData(data);
loadCats();
alert("تم الحفظ 🚀");
}

function loadCats(){
let cats=getData();
let sel=document.getElementById("art-category");
sel.innerHTML="";
cats.forEach(c=>{
sel.innerHTML+=`<option value="${c.id}">${c.title}</option>`;
});
}

function saveArticle(){
let cat=document.getElementById("art-category").value;
let key="art_"+cat;

let articles=JSON.parse(localStorage.getItem(key))||[];

articles.push({
title:document.getElementById("art-title").value,
text:document.getElementById("art-text").value
});

localStorage.setItem(key,JSON.stringify(articles));

renderArchive();
alert("تم النشر 🚀");
}

function renderArchive(){
let cats=getData();
let box=document.getElementById("archive-list");
box.innerHTML="";

cats.forEach(c=>{
let arts=JSON.parse(localStorage.getItem("art_"+c.id))||[];

box.innerHTML+=`
<div class="mb-4 p-3 glass rounded">
<h3 class="text-[#c7a86b] font-bold">${c.title}</h3>
<p class="text-xs text-gray-400">${arts.length} مقالات</p>
</div>`;
});
}

document.addEventListener("DOMContentLoaded",()=>{
loadCats();
renderArchive();
});
</script>

</body>
</html>
